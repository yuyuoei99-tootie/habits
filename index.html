<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HydroPulse - Biometric Quest</title>

    <!-- Tailwind CSS Script Compiler -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#acf2f7',
                        'on-primary': '#003739',
                        'primary-container': '#90d6da',
                        'on-primary-container': '#075f62',
                        'primary-fixed': '#a8eff3',
                        'primary-fixed-dim': '#8cd2d6',
                        secondary: '#c1c4e5',
                        'on-secondary': '#2b2f48',
                        'secondary-container': '#414560',
                        'on-secondary-container': '#b0b3d3',
                        tertiary: '#abf3f2',
                        'on-tertiary': '#003737',
                        'tertiary-container': '#8fd7d6',
                        'on-tertiary-container': '#035f5f',
                        background: '#00142a',
                        'on-background': '#d2e4ff',
                        surface: '#00142a',
                        'on-surface': '#d2e4ff',
                        'surface-dim': '#00142a',
                        'surface-bright': '#233a56',
                        'surface-container': '#05203b',
                        'surface-container-low': '#011c37',
                        'surface-container-lowest': '#000f21',
                        'surface-container-high': '#122b46',
                        'surface-container-highest': '#1e3652',
                        'surface-variant': '#1e3652',
                        'on-surface-variant': '#bec8c9',
                        outline: '#899393',
                        'outline-variant': '#3f4949',
                        error: '#ffb4ab',
                        'on-error': '#690005',
                        'error-container': '#93000a',
                        'on-error-container': '#ffdad6',
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        headline: ["Space Mono", "monospace"],
                    }
                }
            }
        }
    </script>

    <!-- Global CSS Custom Styling & Pixel Theme Icons -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            background-color: #000b18;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Pixel borders and retro alignment frames */
        .pixel-border {
            border: 2px solid #547596;
            box-shadow: 0px 4px 0px rgba(0, 0, 0, 0.45);
        }
        
        .pixel-shadow {
            box-shadow: 0px 2px 0px rgba(255, 255, 255, 0.05) inset, 0px 4px 0px rgba(0,0,0,0.4);
        }

        .pixel-button-press:active {
            transform: translateY(2px);
            box-shadow: 0px 1px 0px rgba(0,0,0,0.4);
        }

        /* Scan sweeper keyframes */
        @keyframes scanSweep {
            0% { top: 0%; opacity: 0.3; }
            50% { top: 100%; opacity: 1; }
            100% { top: 0%; opacity: 0.3; }
        }

        /* Screen transitions */
        .screen-anim {
            animation: fadeInUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Custom scrollbar adjustments for smartphone comfort */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Floating elements */
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(1deg); }
        }
        .float-avatar {
            animation: subtleFloat 3s ease-in-out infinite;
        }
    </style>

    <!-- Babel Transpiler for inline script parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.3/babel.min.js"></script>
</head>
<body class="text-on-background min-h-screen flex items-center justify-center">

    <!-- Container behaving like a modern native smartphone -->
    <div id="root" class="w-full max-w-[480px] h-screen bg-[#001021] relative flex flex-col overflow-hidden shadow-2xl border-x border-[#122b46]"></div>

    <!-- Script Application Logic -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from "https://esm.sh/react@18.2.0";
        import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";
        import { 
            Home as HomeIcon, Award, ShieldAlert, Sparkles, Check, Clock, ChevronRight, Lock, 
            Calendar, BookOpen, Layers, Zap, AlertCircle, TrendingUp, BarChart3, ShoppingCart, 
            LogIn, LogOut, Compass, Camera, Mic, X, AlertTriangle, Loader2, Flame, ChevronUp, 
            TrendingDown, ShoppingBag, Shield, CheckCircle2, Trash2, Sun, Moon, ToggleLeft, 
            ToggleRight, Share2, Users, ArrowLeft, RefreshCw, Wand2, ShieldCheck, CheckCircle, Send
        } from "https://esm.sh/lucide-react@0.344.0";

        // Hardcoded Firebase Configurations Block
        const firebaseConfig = {
            apiKey: "",
            authDomain: "",
            projectId: "",
            storageBucket: "",
            messagingSenderId: "",
            appId: "",
            databaseId: ""
        };

        // Firebase Service ESM Import Declarations
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, signInWithPopup, signOut, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        let appInstance = null;
        let dbInstance = null;
        let authInstance = null;
        let googleProviderInstance = null;
        let isFirebaseInitialized = false;

        function initializeFirebaseClient() {
            if (isFirebaseInitialized) return true;
            const hasKeys = firebaseConfig.apiKey && firebaseConfig.apiKey.trim() !== "";
            if (!hasKeys) {
                console.warn("⚠️ Firebase credentials empty. App initialized in Standalone fallback.");
                return false;
            }
            try {
                appInstance = initializeApp(firebaseConfig);
                dbInstance = getFirestore(appInstance);
                authInstance = getAuth(appInstance);
                googleProviderInstance = new GoogleAuthProvider();
                isFirebaseInitialized = true;
                return true;
            } catch (err) {
                console.error("Firebase init failed:", err);
                return false;
            }
        }

        // --- Milestone Avatar Images Mapping ---
        const AVATAR_MILESTONES = [
            {
                level: 1,
                name: "Rookie Warrior",
                imgUrl: "https://res.cloudinary.com/diputd1zo/image/upload/q_auto/f_auto/v1779767452/Screenshot_2026-05-26_at_10.50.30-removebg-preview_aicryj.png"
            },
            {
                level: 2,
                name: "Elite Athlete",
                imgUrl: "https://res.cloudinary.com/diputd1zo/image/upload/q_auto/f_auto/v1779768330/Screenshot_2026-05-26_at_11.04.01-removebg-preview_tuzeht.png"
            },
            {
                level: 3,
                name: "Lotus Zen Master",
                imgUrl: "https://res.cloudinary.com/diputd1zo/image/upload/q_auto/f_auto/v1779768497/Screenshot_2026-05-26_at_11.06.44-removebg-preview_ei4pjm.png"
            }
        ];

        function getAvatarUrl(level) {
            if (level <= 1) return AVATAR_MILESTONES[0].imgUrl;
            if (level === 2) return AVATAR_MILESTONES[1].imgUrl;
            return AVATAR_MILESTONES[2].imgUrl;
        }

        function getStanceName(level) {
            if (level <= 1) return "ROOKIE WARRIOR";
            if (level === 2) return "ELITE ATHLETE";
            return "ZEN MASTER";
        }

        // --- SUB-COMPONENT: HOME PAGE ---
        function HomePage({ playerState, quests, onToggleQuest, onTriggerAIVerification }) {
            return (
                <div className="space-y-6 screen-anim">
                    {/* Character Avatar status block */}
                    <div className="bg-surface-container rounded-2xl p-5 border border-outline-variant/35 flex items-center gap-4 relative overflow-hidden shadow-inner">
                        <div className="absolute top-0 right-0 bg-[#0c2f54] text-[#acf2f7] py-1 px-3 text-[9px] font-mono rounded-bl-xl border-l border-b border-outline-variant uppercase font-bold">
                            STREAK {playerState.consecutiveDays}D ({(playerState.multiplier ?? 1).toFixed(1)}X)
                        </div>
                        <div className="relative w-20 h-20 bg-surface-container-high rounded-xl border border-outline-variant/40 flex items-center justify-center p-1.5 flex-shrink-0">
                            <img src={getAvatarUrl(playerState.level)} alt="Avatar" class="w-16 h-16 object-contain float-avatar" referrerPolicy="no-referrer" />
                        </div>
                        <div className="min-w-0">
                            <span className="text-[10px] text-primary uppercase font-bold tracking-widest font-mono">STATUS: ACTIVE</span>
                            <h2 className="font-headline text-lg font-black uppercase text-on-surface truncate mt-0.5">{getStanceName(playerState.level)}</h2>
                            <div className="flex items-center gap-2 mt-2">
                                <span className="text-secondary font-mono text-xs font-bold">$ {playerState.tokens}</span>
                                <span className="text-on-surface-variant font-medium text-[11px] font-sans">Level {playerState.level} Warrior</span>
                            </div>
                        </div>
                    </div>

                    {/* Weekly progress bars */}
                    <div className="bg-surface-container p-4.5 rounded-xl border border-outline-variant/30 space-y-3">
                        <div className="flex justify-between items-center text-xs">
                            <span className="font-headline font-bold uppercase text-[10px] text-on-surface-variant tracking-wider">Daily Hydration Quest Progress</span>
                            <span className="font-mono text-primary font-bold">{quests.filter(q => q.completedToday).length}/3 Cleared</span>
                        </div>
                        <div className="h-2.5 bg-neutral-900 rounded-full overflow-hidden flex p-0.5">
                            <div 
                                className="h-full bg-gradient-to-r from-primary to-blue-500 rounded-full transition-all duration-500"
                                style={{ width: `${(quests.filter(q => q.completedToday).length / 3) * 100}%` }}
                            />
                        </div>
                    </div>

                    {/* Quest/Habits Tracker Lists */}
                    <div className="space-y-3">
                        <div className="flex justify-between items-center border-l-4 border-primary pl-2.5">
                            <h3 className="font-headline text-sm font-bold uppercase tracking-wide">Daily Active Quests</h3>
                            <span className="text-[9px] font-mono text-on-surface-variant">RESET DAILY</span>
                        </div>

                        <div className="space-y-3.5">
                            {quests.map((q) => {
                                const isBoosted = playerState.multiplier > 1.0;
                                return (
                                    <div 
                                        key={q.id}
                                        className={`p-4 bg-surface-container-high rounded-xl border flex items-center gap-4 transition-all duration-200 shadow-sm relative ${q.completedToday ? 'border-primary/40 bg-surface-container-high/40 opacity-75' : 'border-outline-variant'}`}
                                    >
                                        <button 
                                            onClick={() => onToggleQuest(q.id)}
                                            className={`w-9 h-9 rounded-lg border-2 flex items-center justify-center font-mono font-bold transition-all active:scale-95 flex-shrink-0 cursor-pointer ${q.completedToday ? 'bg-primary border-primary text-on-primary' : 'border-outline-variant hover:border-primary/50 text-surface/0'}`}
                                        >
                                            <Check className="w-5 h-5" />
                                        </button>

                                        <div className="flex-1 min-w-0">
                                            <div className="flex justify-between items-start gap-2">
                                                <h4 className={`text-sm font-semibold leading-tight truncate ${q.completedToday ? 'line-through text-on-surface-variant' : 'text-on-surface'}`}>{q.name}</h4>
                                                <span className="text-[10px] font-mono text-primary flex-shrink-0">+{q.xpReward} XP</span>
                                            </div>
                                            <p className="text-[11px] text-on-surface-variant leading-normal mt-1 font-sans line-clamp-2">{q.description}</p>
                                        </div>

                                        <button 
                                            onClick={() => onTriggerAIVerification(q)}
                                            className="p-2.5 bg-primary/10 hover:bg-primary/20 border border-primary/20 hover:border-primary/50 text-primary rounded-xl transition-all font-mono text-[9px] font-bold uppercase tracking-wider flex flex-col items-center gap-0.5"
                                        >
                                            <Sparkles className="w-3.5 h-3.5" />
                                            AI SCAN
                                        </button>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // --- SUB-COMPONENT: ARENA PAGE ---
        function Arena({ playerState, quests, onTriggerAIVerification }) {
            const hitFactor = playerState.bossHp <= 0 ? 0 : playerState.bossHp;
            return (
                <div className="space-y-6 screen-anim">
                    {/* Active Boss Fight Screen Banner */}
                    <div className="relative aspect-[16/9] w-full bg-surface-container-highest rounded-2xl overflow-hidden pixel-border flex flex-col justify-between p-5 shadow-lg">
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent pointer-events-none" />
                        <div className="z-10 flex justify-between items-start">
                            <div>
                                <span className="bg-error/20 border border-error/55 text-error text-[8px] font-mono font-bold py-0.5 px-2 rounded-full uppercase tracking-wider block">LEVEL 12 ELITE BOSS</span>
                                <h2 className="font-headline text-lg font-black text-rose-300 uppercase leading-none mt-1">THE AQUA-BEHEMOTH</h2>
                            </div>
                            <span className="font-mono text-rose-400 font-bold text-xs">{playerState.bossHp}% HP</span>
                        </div>

                        {/* Animated sprite representation */}
                        <div className="flex justify-center my-1 z-10">
                            <div className="w-20 h-20 bg-rose-900/20 border-2 border-dashed border-error/30 rounded-full flex items-center justify-center animate-pulse">
                                <span className="text-4xl">🐙</span>
                            </div>
                        </div>

                        {/* Health Bar Slider */}
                        <div className="space-y-1.5 z-10 w-full">
                            <div className="flex justify-between text-[8px] font-mono text-rose-300">
                                <span className="uppercase font-bold">Mainframe Armor Integrity</span>
                                <span>{hitFactor}/100 POINTS</span>
                            </div>
                            <div className="h-3 w-full bg-neutral-900 rounded-full p-0.5 overflow-hidden border border-outline-variant/30">
                                <div 
                                    className="h-full bg-gradient-to-r from-red-500 via-rose-400 to-amber-500 rounded-full transition-all duration-500"
                                    style={{ width: `${hitFactor}%` }}
                                />
                            </div>
                        </div>
                    </div>

                    {/* Weapon controls actions */}
                    <div className="p-4 bg-surface-container rounded-xl border border-outline-variant/30 space-y-4">
                        <div className="flex items-start gap-3">
                            <ShieldAlert className="w-5 h-5 text-amber-500 flex-shrink-0" />
                            <div>
                                <h4 className="text-xs font-bold uppercase font-headline">FIGHT PROTOCOLS</h4>
                                <p className="text-[11px] text-on-surface-variant font-sans leading-relaxed mt-1">Deduct HP from the Behemoth by completing daily targets. Standard checks strike for 10% damage, while full AI Camera Scans deal high-impact 20% critical damage!</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                            {quests.map((q) => (
                                <button
                                    key={q.id}
                                    onClick={() => onTriggerAIVerification(q)}
                                    className="bg-surface-container-high hover:bg-surface-container-highest border border-outline-variant rounded-xl p-3 flex flex-col items-center gap-1.5 text-center active:scale-95 transition-all text-[9px] font-mono font-bold uppercase text-primary font-bold"
                                >
                                    <span className="text-lg">⚔️</span>
                                    <span>{q.id}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        // --- SUB-COMPONENT: STATS PAGE ---
        function Stats({ playerState }) {
            return (
                <div className="space-y-6 screen-anim">
                    {/* Compact Custom SVG Bar Charts Representing History */}
                    <section className="bg-surface-container p-5 rounded-xl border border-[#163353] space-y-4">
                        <div className="flex justify-between items-center border-l-3 border-[#acf2f7] pl-2 font-headline">
                            <h3 className="text-xs font-bold uppercase">HABIT LOG TREND</h3>
                            <span className="text-[8px] text-on-surface-variant">PAST 7 DAYS</span>
                        </div>
                        <div className="h-44 w-full flex items-end justify-between px-2 pt-4">
                            {[1, 2, 0, 3, 1, 2, 1].map((val, idx) => {
                                const labels = ["M", "T", "W", "T", "F", "S", "S"];
                                return (
                                    <div key={idx} className="flex flex-col items-center gap-2 flex-grow">
                                        <div className="relative w-7 bg-surface-container-high rounded-t-md flex items-end justify-center border border-outline-variant/35 h-32">
                                            <div 
                                                className="w-full bg-gradient-to-t from-primary/80 to-blue-400 rounded-t-sm transition-all duration-500"
                                                style={{ height: `${(val / 3) * 100}%` }}
                                            />
                                            <span className="absolute -top-5 font-mono text-[9px] font-bold text-on-surface">{val}L</span>
                                        </div>
                                        <span className="font-mono text-[10px] text-on-surface-variant">{labels[idx]}</span>
                                    </div>
                                );
                            })}
                        </div>
                    </section>
                </div>
            );
        }

        // --- SUB-COMPONENT: SHOP PAGE ---
        function Shop({ playerState, onBuyItem, onEquipCosmetic }) {
            const shopItems = [
                { id: 'speed_multiplier', name: 'Speed Multiplier', cost: 50, desc: 'Hydrate 2x faster for 1hr', emoji: '⚡' },
                { id: 'double_xp', name: 'Double XP Boost', cost: 75, desc: 'Double leveling speed limits', emoji: '🏆' },
                { id: 'streak_shield', name: 'Streak Shield', cost: 100, desc: 'Prevents routine drops', emoji: '🛡️' }
            ];
            const cosmetics = [
                { id: 'cool_water', name: 'Chilled Flask', cost: 30, desc: 'Heads-up display customization', emoji: '🍶' },
                { id: 'rainbow_aura', name: 'Rainbow Aura', cost: 200, desc: 'Glow with colorful pixels', emoji: '🌈' }
            ];

            return (
                <div className="space-y-6 screen-anim">
                    <section className="space-y-4">
                        <h3 className="font-headline text-xs font-bold tracking-wider uppercase border-l-4 border-primary pl-2.5">EQUIPPABLE BOOSTERS</h3>
                        <div className="space-y-3">
                            {shopItems.map((item) => {
                                const active = playerState.purchasedItemIds.includes(item.id);
                                return (
                                    <div key={item.id} className="p-4 bg-surface-container rounded-xl border border-outline-variant/30 flex items-center justify-between gap-3 shadow">
                                        <div className="flex items-center gap-3">
                                            <span className="text-2xl">{item.emoji}</span>
                                            <div>
                                                <h4 className="font-headline text-xs font-bold uppercase">{item.name}</h4>
                                                <p className="text-[10px] text-on-surface-variant font-sans mt-0.5">{item.desc}</p>
                                            </div>
                                        </div>
                                        {active ? (
                                            <span className="text-[9px] font-bold text-secondary bg-secondary/15 py-1.5 px-3 border border-secondary/20 rounded">EQUIPPED</span>
                                        ) : (
                                            <button 
                                                onClick={() => onBuyItem(item.id, item.cost, false)}
                                                className="py-1.5 px-3.5 bg-primary/10 hover:bg-primary/20 border border-primary/20 hover:border-primary/50 text-primary font-mono text-[10px] font-bold rounded-lg transition-all cursor-pointer"
                                            >
                                                $ {item.cost}
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </section>

                    <section className="space-y-4">
                        <h3 className="font-headline text-xs font-bold tracking-wider uppercase border-l-4 border-secondary pl-2.5">AESTHETIC SKINS</h3>
                        <div className="space-y-3">
                            {cosmetics.map((item) => {
                                const bought = playerState.purchasedItemIds.includes(item.id);
                                const equipped = playerState.equippedCosmetics.includes(item.id);
                                return (
                                    <div key={item.id} className="p-4 bg-surface-container rounded-xl border border-outline-variant/30 flex items-center justify-between gap-3 shadow">
                                        <div className="flex items-center gap-3">
                                            <span className="text-2xl">{item.emoji}</span>
                                            <div>
                                                <h4 className="font-headline text-xs font-bold uppercase">{item.name}</h4>
                                                <p className="text-[10px] text-on-surface-variant font-sans mt-0.5">{item.desc}</p>
                                            </div>
                                        </div>
                                        {equipped ? (
                                            <span className="text-[9px] font-bold text-primary bg-primary/15 py-1.5 px-3.5 border border-primary/20 rounded">SKIN ACTIVE</span>
                                        ) : bought ? (
                                            <button 
                                                onClick={() => onEquipCosmetic(item.id)}
                                                className="py-1.5 px-3.5 bg-secondary/20 hover:bg-secondary/35 border border-secondary/40 text-on-primary-container font-mono text-[10px] font-bold rounded-lg transition-all cursor-pointer"
                                            >
                                                EQUIP
                                            </button>
                                        ) : (
                                            <button 
                                                onClick={() => onBuyItem(item.id, item.cost, true)}
                                                className="py-1.5 px-3.5 bg-secondary/10 hover:bg-secondary/25 border border-secondary/20 hover:border-secondary/40 text-primary font-mono text-[10px] font-bold rounded-lg transition-all cursor-pointer"
                                            >
                                                $ {item.cost}
                                            </button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </section>
                </div>
            );
        }

        // --- SUB-COMPONENT: RANK PAGE ---
        function Rank({ playerState }) {
            const list = [
                { rank: 1, name: "MichaelPhelpsJr", xp: 12450, level: 42, icon: "🥇" },
                { rank: 2, name: "Aqua_Beast", xp: 8900, level: 29, icon: "🥈" },
                { rank: 3, name: "You (Warrior)", xp: playerState.level * 100 + playerState.xp, level: playerState.level, isMe: true, icon: "🛡️" }
            ];

            return (
                <div className="space-y-6 screen-anim">
                    <section className="space-y-4">
                        <h3 className="font-headline text-xs font-bold tracking-wider uppercase border-l-4 border-primary pl-2.5">LEADERBOARDS</h3>
                        <div className="bg-surface-container rounded-xl border border-outline-variant/30 divide-y divide-outline-variant/15">
                            {list.map((u) => (
                                <div key={u.rank} className={`p-3.5 flex items-center justify-between text-xs ${u.isMe ? 'bg-primary/10 border-y border-primary/20' : ''}`}>
                                    <div className="flex items-center gap-3">
                                        <span className="text-base w-6 text-center">{u.icon}</span>
                                        <div>
                                            <span className={`font-bold font-headline uppercase leading-none ${u.isMe ? 'text-primary' : ''}`}>{u.name}</span>
                                            <span className="text-[10px] text-on-surface-variant block mt-0.5">Level {u.level} Fighter</span>
                                        </div>
                                    </div>
                                    <span className="font-mono text-primary font-bold">{u.xp} XP</span>
                                </div>
                            ))}
                        </div>
                    </section>
                </div>
            );
        }

        // --- SUB-COMPONENT: SETTINGS PAGE ---
        function Settings({ playerState, onResetData, onSyncData, onSimulateTime }) {
            return (
                <div className="space-y-6 screen-anim">
                    {/* Simulator options for rapid timing test triggers */}
                    {onSimulateTime && (
                        <div className="bg-surface-container rounded-xl p-4.5 border border-outline-variant/35 space-y-3.5 shadow-md">
                            <h3 className="font-headline text-xs font-bold text-primary tracking-wider uppercase">Streak Simulator Controls</h3>
                            <p className="text-[11px] text-on-surface-variant leading-relaxed">Fast-forward consecutive day counters or miss days instantly in standalone mode to verify user stat multiplier changes:</p>
                            <div className="grid grid-cols-2 gap-2">
                                <button 
                                    onClick={() => onSimulateTime('consecutive')}
                                    className="py-2.5 bg-primary/10 hover:bg-primary/20 border border-primary/20 rounded-xl font-mono text-[9px] font-bold uppercase text-primary transition-all active:scale-95 cursor-pointer"
                                >
                                    🚀 Next Consec Day
                                </button>
                                <button 
                                    onClick={() => onSimulateTime('missed')}
                                    className="py-2.5 bg-error/15 hover:bg-error/30 border border-error/25 rounded-xl font-mono text-[9px] font-bold uppercase text-error transition-all active:scale-95 cursor-pointer"
                                >
                                    ⚠️ Sim Calendar Miss
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Safety wipes */}
                    <div className="p-4.5 bg-error-container/10 border border-error/20 rounded-xl space-y-4">
                        <div>
                            <h4 className="font-headline text-xs font-bold text-error uppercase">DELETE GAME CACHE</h4>
                            <p className="text-[10.5px] text-on-surface-variant font-sans leading-normal mt-1">Erase your statistics, levels, equippables, and streak counts back to the default state instantly.</p>
                        </div>
                        <button 
                            onClick={onResetData}
                            className="w-full py-2.5 bg-error hover:bg-[#b91c1c] text-white font-headline text-xs font-bold rounded-lg border border-error/45 transition-all text-center uppercase cursor-pointer"
                        >
                            Reset Registry Fallback
                        </button>
                    </div>
                </div>
            );
        }

        // --- MAIN APP COMPONENT ORCHESTRATOR ---
        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [playerState, setPlayerState] = useState(DEFAULT_PLAYER_STATE);
            const [quests, setQuests] = useState(DEFAULT_QUESTS);
            
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [firebaseActive, setFirebaseActive] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);

            // Active Scan View State
            const [activeVerifyQuest, setActiveVerifyQuest] = useState(null);

            // Level up views
            const [levelUpOverlay, setLevelUpOverlay] = useState(false);

            useEffect(() => {
                const isReady = initializeFirebaseClient();
                setFirebaseActive(isReady);
                if (isReady && authInstance) {
                    onAuthStateChanged(authInstance, (snapUser) => {
                        setUser(snapUser);
                        setAuthLoading(false);
                    });
                } else {
                    setAuthLoading(false);
                }
            }, []);

            // Watch user profile sync
            useEffect(() => {
                if (!user || !isFirebaseReady()) return;
                setAuthLoading(true);
                loadPlayerStateFromCloud(user.uid).then((cloud) => {
                    if (cloud) {
                        setPlayerState(cloud.playerState);
                        if (cloud.quests && cloud.quests.length > 0) {
                            setQuests(cloud.quests);
                        }
                        showToast(`☁️ Google Profile Verified: Welcome back, ${user.displayName}!`);
                    } else {
                        savePlayerStateToCloud(user.uid, DEFAULT_PLAYER_STATE, DEFAULT_QUESTS);
                    }
                    setAuthLoading(false);
                }).catch(err => {
                    console.error("Profile load err:", err);
                    setAuthLoading(false);
                });
            }, [user]);

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const triggerGoogleLogin = async () => {
                try {
                    initializeFirebaseClient();
                    const loggedUser = await loginWithGoogle();
                    if (loggedUser) {
                        setUser(loggedUser);
                    }
                } catch (err) {
                    console.error("Login popup err:", err);
                    showToast("⚠️ Firebase Auth Popup Blocked: Enacting Sandboxed Profile Mode.");
                }
            };

            const triggerLogout = async () => {
                if (authInstance) {
                    await signOut(authInstance);
                    setUser(null);
                    setPlayerState(DEFAULT_PLAYER_STATE);
                    setQuests(DEFAULT_QUESTS);
                    showToast("🔒 Logged out of profile safely.");
                }
            };

            // Toggle Quest completion checks manually
            const handleToggleQuest = (questId) => {
                const nextQuests = quests.map(q => q.id === questId ? { ...q, completedToday: !q.completedToday } : q);
                setQuests(nextQuests);
                
                const quest = quests.find(q => q.id === questId);
                if (!quest) return;
                
                const isChecking = !quest.completedToday;
                const multiplier = playerState.multiplier ?? 1.0;
                
                const tokensAwardPercent = isChecking ? Math.round(quest.tokenReward * multiplier) : -Math.round(quest.tokenReward * multiplier);
                const xpAwardPercent = isChecking ? quest.xpReward : -quest.xpReward;

                let nextTokens = Math.max(0, playerState.tokens + tokensAwardPercent);
                let nextXp = playerState.xp + xpAwardPercent;
                let nextLvl = playerState.level;

                if (nextXp >= playerState.xpToNextLevel && xpAwardPercent > 0) {
                    nextLvl += 1;
                    nextXp = nextXp - playerState.xpToNextLevel;
                    setLevelUpOverlay(true);
                }

                // Balance consecutive calculations
                let nextConsec = playerState.consecutiveDays;
                let nextMult = playerState.multiplier;
                if (isChecking) {
                    if (quests.filter(q => q.completedToday).length + 1 === 3) {
                        nextConsec = (nextConsec || 0) + 1;
                        nextMult = nextConsec >= 5 ? 1.5 : nextConsec >= 2 ? 1.2 : 1.0;
                        showToast("🌟 Category Master! Routine streak and multiplier increased.");
                    }
                }

                const updated = {
                    ...playerState,
                    tokens: nextTokens,
                    xp: Math.max(0, nextXp),
                    level: nextLvl,
                    consecutiveDays: nextConsec,
                    multiplier: nextMult,
                    bossHp: isChecking ? Math.max(0, playerState.bossHp - 10) : Math.min(100, playerState.bossHp + 10)
                };

                setPlayerState(updated);
                syncToLocalStorage(updated, nextQuests);
            };

            // Custom local persistent local storage helpers
            const syncToLocalStorage = (p, q) => {
                localStorage.setItem('local_p', JSON.stringify(p));
                localStorage.setItem('local_q', JSON.stringify(q));
                if (user && isFirebaseReady()) {
                    savePlayerStateToCloud(user.uid, p, q);
                }
            };

            const handleSimulateTime = (mode) => {
                if (mode === 'consecutive') {
                    const nextPlayer = {
                        ...playerState,
                        consecutiveDays: (playerState.consecutiveDays ?? 0) + 1,
                        multiplier: (playerState.consecutiveDays ?? 0) + 1 >= 5 ? 1.5 : (playerState.consecutiveDays ?? 0) + 1 >= 2 ? 1.2 : 1.0
                    };
                    const resetQ = quests.map(q => ({ ...q, completedToday: false }));
                    setPlayerState(nextPlayer);
                    setQuests(resetQ);
                    syncToLocalStorage(nextPlayer, resetQ);
                    showToast("🚀 Simulated day advance: consecutive streaks and log multiplier increased!");
                } else {
                    const nextPlayer = {
                        ...playerState,
                        consecutiveDays: 0,
                        multiplier: 1.0
                    };
                    const resetQ = quests.map(q => ({ ...q, completedToday: false }));
                    setPlayerState(nextPlayer);
                    setQuests(resetQ);
                    syncToLocalStorage(nextPlayer, resetQ);
                    showToast("⚠️ Missed day simulated: consec drops to 0, multiplier drops to 1.0x!");
                }
            };

            const onBuyItem = (id, cost, isCosmetic) => {
                if (playerState.tokens < cost) {
                    return showToast("❌ Insufficient funds in token wallet balance!");
                }
                const updated = {
                    ...playerState,
                    tokens: playerState.tokens - cost,
                    purchasedItemIds: [...playerState.purchasedItemIds, id],
                    equippedCosmetics: isCosmetic ? [...playerState.equippedCosmetics, id] : playerState.equippedCosmetics
                };
                setPlayerState(updated);
                syncToLocalStorage(updated, quests);
                showToast(`🛒 Purchased ${id} successfully!`);
            };

            const onEquipCosmetic = (id) => {
                const nextEquipped = playerState.equippedCosmetics.includes(id) 
                    ? playerState.equippedCosmetics.filter(x => x !== id) 
                    : [...playerState.equippedCosmetics, id];
                const updated = {
                    ...playerState,
                    equippedCosmetics: nextEquipped
                };
                setPlayerState(updated);
                syncToLocalStorage(updated, quests);
                showToast(`🎒 Equipped visual cosmetic skin.`);
            };

            const resetData = () => {
                setPlayerState(DEFAULT_PLAYER_STATE);
                setQuests(DEFAULT_QUESTS);
                localStorage.clear();
                showToast("🗑️ User statistics database cleared successfully.");
            };

            // Trigger actual simulated Scan Quests
            const handleSuccessScan = (questId, xpGift, tokenGift, msg) => {
                const nextQuests = quests.map(q => q.id === questId ? { ...q, completedToday: true } : q);
                setQuests(nextQuests);

                let nextXp = playerState.xp + xpGift;
                let nextLvl = playerState.level;
                if (nextXp >= playerState.xpToNextLevel) {
                    nextLvl += 1;
                    nextXp -= playerState.xpToNextLevel;
                    setLevelUpOverlay(true);
                }

                const updated = {
                    ...playerState,
                    xp: nextXp,
                    level: nextLvl,
                    tokens: playerState.tokens + tokenGift,
                    bossHp: Math.max(0, playerState.bossHp - 20)
                };
                setPlayerState(updated);
                syncToLocalStorage(updated, nextQuests);
                setActiveVerifyQuest(null);
                showToast(msg);
            };

            return (
                <div className="flex-1 flex flex-col h-full bg-[#001021]">
                    {/* TOP SMARTPHONE INTERFACE HUD / HEADER */}
                    <header className="px-5 pt-3 pb-3 bg-surface-container border-b border-outline-variant/30 flex justify-between items-center z-40 flex-shrink-0">
                        <div className="flex items-center gap-2">
                            <span className="text-xl">💧</span>
                            <div>
                                <h1 className="font-headline font-bold text-xs leading-none text-primary uppercase tracking-wider">HydroPulse Base</h1>
                                <span className="text-[9px] font-mono text-on-surface-variant block mt-0.5 uppercase tracking-widest">{user ? 'CLOUD CONNECTED' : 'SANDBOX STANDALONE'}</span>
                            </div>
                        </div>

                        {/* Top Action Google SignIn Toggler */}
                        {user ? (
                            <button 
                                onClick={triggerLogout}
                                className="py-1 px-3 bg-rose-950/20 hover:bg-rose-900/35 border border-rose-900/40 text-rose-300 font-mono text-[9px] font-bold rounded-lg uppercase tracking-wider flex items-center gap-1 cursor-pointer transition-all active:scale-95"
                            >
                                <LogOut className="w-3 h-3" />
                                WIPE LINK
                            </button>
                        ) : (
                            <button 
                                onClick={triggerGoogleLogin}
                                className="py-1 px-3 bg-primary/10 hover:bg-primary/20 border border-primary/25 text-primary font-mono text-[9px] font-bold rounded-lg uppercase tracking-wider flex items-center gap-1 cursor-pointer transition-all active:scale-95"
                            >
                                <LogIn className="w-3 h-3" />
                                LOGIN
                            </button>
                        )}
                    </header>

                    {/* XP AND HEALTH LEVELING BAR HUD BAR */}
                    <div className="bg-surface-container-high px-5 py-2.5 border-b border-outline-variant/30 grid grid-cols-2 gap-4 flex-shrink-0 text-13 z-30 shadow-inner">
                        <div className="space-y-1">
                            <div className="flex justify-between text-[9px] font-mono leading-none">
                                <span className="uppercase text-on-surface-variant">LEVEL PROGRESS</span>
                                <span className="font-bold text-primary">{playerState.xp} / {playerState.xpToNextLevel} XP</span>
                            </div>
                            <div className="h-2 w-full bg-neutral-900 rounded-full overflow-hidden p-px">
                                <div 
                                    className="h-full bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full transition-all duration-300"
                                    style={{ width: `${(playerState.xp / playerState.xpToNextLevel) * 100}%` }}
                                />
                            </div>
                        </div>

                        <div className="space-y-1">
                            <div className="flex justify-between text-[9px] font-mono leading-none">
                                <span className="uppercase text-rose-400">BOSS INTEGRITY</span>
                                <span className="font-bold text-rose-400">{playerState.bossHp}% HP</span>
                            </div>
                            <div className="h-2 w-full bg-neutral-900 rounded-full overflow-hidden p-px">
                                <div 
                                    className="h-full bg-rose-500 rounded-full transition-all duration-300"
                                    style={{ width: `${playerState.bossHp}%` }}
                                />
                            </div>
                        </div>
                    </div>

                    {/* CENTER SCROLLABLE PAGE ROUTER VIEW */}
                    <main className="flex-1 overflow-y-auto p-5 no-scrollbar pb-[100px] z-10">
                        {activeTab === 'home' && <HomePage playerState={playerState} quests={quests} onToggleQuest={handleToggleQuest} onTriggerAIVerification={(q) => setActiveVerifyQuest(q)} />}
                        {activeTab === 'arena' && <Arena playerState={playerState} quests={quests} onTriggerAIVerification={(q) => setActiveVerifyQuest(q)} />}
                        {activeTab === 'stats' && <Stats playerState={playerState} />}
                        {activeTab === 'shop' && <Shop playerState={playerState} onBuyItem={onBuyItem} onEquipCosmetic={onEquipCosmetic} />}
                        {activeTab === 'rank' && <Rank playerState={playerState} />}
                        {activeTab === 'settings' && <Settings playerState={playerState} onResetData={resetData} onSyncData={() => showToast("Database synched.")} onSimulateTime={handleSimulateTime} />}
                    </main>

                    {/* BOTTOM NATIVE SMARTPHONE MENU BACKPACK */}
                    <nav className="absolute bottom-0 inset-x-0 bg-surface-container border-t border-outline-variant/30 px-3 pt-3.5 pb-7 flex justify-around items-center z-50">
                        <button 
                            onClick={() => setActiveTab('home')}
                            className={`flex flex-col items-center gap-1 text-[10px] font-bold uppercase transition-all tracking-wider active:scale-90 cursor-pointer ${activeTab === 'home' ? 'text-primary' : 'text-on-surface-variant'}`}
                        >
                            <HomeIcon className="w-5 h-5" />
                            <span>QUESTS</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('arena')}
                            className={`flex flex-col items-center gap-1 text-[10px] font-bold uppercase transition-all tracking-wider active:scale-90 cursor-pointer ${activeTab === 'arena' ? 'text-primary' : 'text-on-surface-variant'}`}
                        >
                            <span className="text-xl h-5 leading-none">⚔️</span>
                            <span>ARENA</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('stats')}
                            className={`flex flex-col items-center gap-1 text-[10px] font-bold uppercase transition-all tracking-wider active:scale-90 cursor-pointer ${activeTab === 'stats' ? 'text-primary' : 'text-on-surface-variant'}`}
                        >
                            <BarChart3 className="w-5 h-5" />
                            <span>INDEX</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('shop')}
                            className={`flex flex-col items-center gap-1 text-[10px] font-bold uppercase transition-all tracking-wider active:scale-90 cursor-pointer ${activeTab === 'shop' ? 'text-primary' : 'text-on-surface-variant'}`}
                        >
                            <ShoppingCart className="w-5 h-5" />
                            <span>SHOP</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('rank')}
                            className={`flex flex-col items-center gap-1 text-[10px] font-bold uppercase transition-all tracking-wider active:scale-90 cursor-pointer ${activeTab === 'rank' ? 'text-primary' : 'text-on-surface-variant'}`}
                        >
                            <Award className="w-5 h-5" />
                            <span>RANK</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('settings')}
                            className={`flex flex-col items-center gap-1 text-[10px] font-bold uppercase transition-all tracking-wider active:scale-90 cursor-pointer ${activeTab === 'settings' ? 'text-primary' : 'text-on-surface-variant'}`}
                        >
                            <SettingsIcon className="w-5 h-5" />
                            <span>CONFIG</span>
                        </button>
                    </nav>

                    {/* FLOATING RETRO NOTIFICATIONS TOAST */}
                    {toastMessage && (
                        <div className="absolute top-16 inset-x-5 bg-surface-container-highest/95 border border-primary/25 p-3.5 rounded-xl z-[150] shadow-2xl flex items-center gap-3 screen-anim backdrop-blur-md">
                            <Sparkles className="w-4.5 h-4.5 text-primary flex-shrink-0 animate-pulse" />
                            <span className="text-[11px] text-[#e3efff] font-sans leading-snug">{toastMessage}</span>
                        </div>
                    )}

                    {/* INTERACTIVE SCANNER OVERLAY MODAL */}
                    {activeVerifyQuest && (
                        <InteractiveScannerOverlay 
                            quest={activeVerifyQuest} 
                            onClose={() => setActiveVerifyQuest(null)}
                            onSuccess={handleSuccessScan}
                        />
                    )}

                    {/* RETRO LEVEL-UP SHADOW SHOW */}
                    {levelUpOverlay && (
                        <div className="absolute inset-0 bg-[#000b18]/90 backdrop-blur-md z-[200] flex flex-col items-center justify-center p-6 text-center">
                            <div className="w-24 h-24 bg-primary/10 border-2 border-primary rounded-full flex items-center justify-center text-primary text-4xl mb-4 animate-bounce">
                                🌟
                            </div>
                            <h2 className="font-headline text-2xl font-black uppercase text-primary tracking-widest">LEVEL UP!</h2>
                            <p className="text-sm text-on-surface-variant mt-2 font-sans px-8 leading-snug">Congratulations! Your physical calibration level has reached higher tiers of Warrior Mastery!</p>
                            <button 
                                onClick={() => setLevelUpOverlay(false)}
                                className="mt-8 py-3 px-8 bg-primary text-on-primary font-headline text-xs font-bold uppercase tracking-widest rounded-xl pixel-button-press cursor-pointer"
                            >
                                CONTINUE QUEST
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // --- SUB-COMPONENT: INTERACTIVE SCANNER CAMERA OVERLAY ---
        function InteractiveScannerOverlay({ quest, onClose, onSuccess }) {
            const [scanState, setScanState] = useState('idle');
            const [scanProgress, setScanProgress] = useState(0);
            const [stream, setStream] = useState(null);
            const [swimReview, setSwimReview] = useState('');
            const [statusText, setStatusText] = useState('Ready for biometric scanning frame');
            const videoRef = useRef(null);

            useEffect(() => {
                if (quest.id !== 'swim') {
                    startCamera();
                }
                return () => stopCamera();
            }, []);

            const startCamera = async () => {
                try {
                    const mediaStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'user', width: 360, height: 270 }
                    });
                    setStream(mediaStream);
                    if (videoRef.current) {
                        videoRef.current.srcObject = mediaStream;
                    }
                } catch (err) {
                    console.warn("Webcam blocked or unavailable, using synthetic simulation scanner.");
                }
            };

            const stopCamera = () => {
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            };

            const runScanSimulator = () => {
                setScanState('scanning');
                setScanProgress(0);
                const phrases = [
                    'Analyzing joint alignment...',
                    'Skeletal match: 94.2%',
                    'Verifying hydration hydration...',
                    'Biomechanics finalized!'
                ];
                let idx = 0;
                const interval = setInterval(() => {
                    setScanProgress(prev => {
                        const next = prev + 5;
                        const pIndex = Math.min(phrases.length - 1, Math.floor((next / 100) * phrases.length));
                        setStatusText(phrases[pIndex]);
                        if (next >= 100) {
                            clearInterval(interval);
                            setScanState('success');
                            stopCamera();
                            return 100;
                        }
                        return next;
                    });
                }, 120);
            };

            return (
                <div className="absolute inset-0 bg-[#001021] z-[100] p-6 flex flex-col justify-between animate-[fadeIn_0.25s_ease] pb-[40px]">
                    <div className="flex items-center gap-3 mb-4">
                        <button 
                            onClick={onClose}
                            className="p-2 bg-surface-container hover:bg-surface-variant border border-outline-variant text-primary rounded-xl cursor-pointer"
                        >
                            <ArrowLeft className="w-4 h-4" />
                        </button>
                        <div>
                            <span className="text-[9px] font-mono text-primary font-bold uppercase tracking-widest block">BIO VERIFICATION</span>
                            <h2 className="font-headline text-md font-extrabold uppercase text-on-surface truncate leading-none">{quest.name}</h2>
                        </div>
                    </div>

                    <div className="flex-1 flex flex-col justify-center items-center gap-6">
                        {quest.id === 'swim' ? (
                            /* SWIM TEXT ENTRY REVIEW FORM */
                            <div className="w-full bg-surface-container rounded-xl p-5 border border-outline-variant/35 space-y-4">
                                <h4 className="font-headline text-xs font-bold text-primary uppercase">Manual Workout Logging Dialog</h4>
                                <textarea 
                                    value={swimReview}
                                    onChange={(e) => setSwimReview(e.target.value)}
                                    placeholder="Type a 2-sentence description of your swimming session. E.g., 'Completed a 1500m threshold freestyle set with swimming kickboard drills. Focused on strong high-elbow pulling technique.'"
                                    className="w-full h-32 bg-neutral-950 text-white placeholder:text-neutral-600 border border-outline-variant rounded-xl p-3.5 text-xs focus:ring-1 focus:ring-primary focus:outline-none leading-relaxed"
                                />
                                <button
                                    onClick={() => {
                                        if (swimReview.trim().length < 25) {
                                            alert("Please type a more comprehensive, genuine workout review at least 25 characters long !");
                                        } else {
                                            onSuccess('swim', quest.xpReward, quest.tokenReward, "🏊 Hydro Workout Approved! Swim milestones archived successfully!");
                                        }
                                    }}
                                    className="w-full py-3 bg-gradient-to-r from-primary to-blue-500 rounded-xl font-headline text-xs font-bold uppercase text-on-primary cursor-pointer pixel-button-press"
                                >
                                    SUBMIT AQ LOG
                                </button>
                            </div>
                        ) : (
                            /* HIGH FIDELITY BIOMETRIC FRAME SCANNER */
                            <div className="w-full max-w-[340px] flex flex-col items-center gap-4">
                                <div className="w-full aspect-[4/3] bg-neutral-950 border-2 border-dashed border-primary/40 rounded-2xl relative overflow-hidden flex items-center justify-center">
                                    {stream ? (
                                        <video ref={videoRef} autoPlay playsInline muted className="absolute inset-0 w-full h-full object-cover transform scale-x-[-1]" />
                                    ) : (
                                        <div className="text-center p-4 z-10 space-y-2">
                                            <Camera className="w-10 h-10 text-neutral-600 mx-auto animate-pulse" />
                                            <span className="text-[10px] text-neutral-500 font-mono uppercase tracking-widest block">Webcam Feed Fallback Simulator</span>
                                        </div>
                                    )}

                                    {scanState === 'scanning' && (
                                        <>
                                            {/* Neon scan lines */}
                                            <div className="absolute inset-x-0 h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent shadow-[0_0_12px_#22d3ee] z-20 animate-[scanSweep_2.5s_infinite_linear]" />
                                            {/* Progress sweep indicator */}
                                            <div className="absolute inset-0 bg-black/40 backdrop-blur-[1px] flex items-center justify-center z-30">
                                                <span className="font-mono text-4xl font-black text-cyan-400 drop-shadow-[0_0_8px_#22d3ee]">{scanProgress}%</span>
                                            </div>
                                        </>
                                    )}

                                    {scanState === 'success' && (
                                        <div className="absolute inset-0 bg-primary-container/10 backdrop-blur-[1px] flex items-center justify-center z-30">
                                            <div className="text-center space-y-1">
                                                <CheckCircle2 className="w-12 h-12 text-primary mx-auto animate-bounce" />
                                                <span className="text-[10px] text-primary font-mono tracking-wider font-bold block uppercase mt-1">BIOMETRIC OK</span>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="text-center">
                                    <h4 className="font-headline text-xs uppercase text-on-surface tracking-wide">{statusText}</h4>
                                    <p className="text-[10px] text-on-surface-variant font-sans px-3 mt-1 leading-snug">Stabilize physical elements inside alignment frame margins before firing beam analyze.</p>
                                </div>

                                {scanState === 'idle' && (
                                    <button 
                                        onClick={runScanSimulator}
                                        className="w-full py-3 bg-gradient-to-r from-primary to-blue-500 rounded-xl font-headline text-xs font-bold uppercase tracking-wider text-on-primary cursor-pointer pixel-button-press"
                                    >
                                        ACTIVATE RETRO PULSE BEAM
                                    </button>
                                )}

                                {scanState === 'success' && (
                                    <button 
                                        onClick={() => onSuccess(quest.id, quest.xpReward + 5, quest.tokenReward + 10, `🧘 Biometric Alignment Certified: +${quest.xpReward + 5} XP & +${quest.tokenReward + 10} Tokens!`)}
                                        className="w-full py-3 bg-gradient-to-r from-green-400 to-emerald-500 rounded-xl font-headline text-xs font-bold uppercase tracking-wider text-white cursor-pointer pixel-button-press"
                                    >
                                        ACCEPT & CLAIM REWARDS
                                    </button>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- BASAL BASELINE DEFAULTS REGISTRY ---
        const DEFAULT_PLAYER_STATE = {
            level: 3,
            xp: 45,
            tokens: 155,
            xpToNextLevel: 100,
            bossHp: 60,
            consecutiveDays: 4,
            multiplier: 1.2,
            purchasedItemIds: ['cool_water'],
            equippedCosmetics: ['cool_water']
        };

        const DEFAULT_QUESTS = [
            { id: 'stretching', name: 'Daily Stretching', description: 'Hamstring alignment, posture stretches, cervical alignments.', xpReward: 10, tokenReward: 15, completedToday: false },
            { id: 'meals', name: 'Clean Meals Tracking', description: 'Log 3 high-protein, calorie-balanced healthy plates.', xpReward: 15, tokenReward: 20, completedToday: false },
            { id: 'swim', name: 'Swim Cardiorespiratories', description: 'Aquatic threshold swim laps or breathing sets.', xpReward: 25, tokenReward: 35, completedToday: false }
        ];

        // --- GLOBAL LAUNCH SKELETON DIRECTIVES ---
        function checkLocalStorageFallback() {
            try {
                const lp = localStorage.getItem('local_p');
                const lq = localStorage.getItem('local_q');
                if (lp && lq) {
                    return { p: JSON.parse(lp), q: JSON.parse(lq) };
                }
            } catch (e) {
                console.warn("Storage fall back err:", e);
            }
            return null;
        }

        function isFirebaseReady() {
            return isFirebaseInitialized && dbInstance && authInstance;
        }

        const fallback = checkLocalStorageFallback();
        const initialPlayer = fallback ? fallback.p : DEFAULT_PLAYER_STATE;
        const initialQuests = fallback ? fallback.q : DEFAULT_QUESTS;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
